---
services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    restart: unless-stopped
    container_name: palworld-server
    stop_grace_period: 30s  # Set to however long you are willing to wait for the container to gracefully stop
    ports:
      - 8211:8211/udp
      - 27015:27015/udp  # Required if you want your server to show up in the community servers tab
      # - 8212:8212/tcp  # REST API enabled port, enabled by default. DO NOT PORT FORWARD THIS.
    env_file:
      - .env
    volumes:
      - ./palworld:/palworld/

  palworld-pvp:
    image: thijsvanloef/palworld-server-docker:latest
    restart: unless-stopped
    container_name: palworld-server-pvp
    stop_grace_period: 30s  # Set to however long you are willing to wait for the container to gracefully stop
    ports:
      - 8221:8221/udp
      - 27016:27016/udp  # Required if you want your server to show up in the community servers tab
      # - 8222:8222/tcp  # REST API enabled port, enabled by default. DO NOT PORT FORWARD THIS.
    env_file:
      - .env.pvp
    volumes:
      - ./palworld-pvp:/palworld/
